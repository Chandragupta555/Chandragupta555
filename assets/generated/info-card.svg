        font-family: Consolas, "Courier New", ui-monospace, monospace;
        font-size: 13.5px;
        white-space: pre;
      }
    </style>
  </defs>
  <rect x="1" y="1" width="488" height="254" rx="8" ry="8" fill="#0d1117" stroke="#2a2a2a" stroke-width="1.5" />
